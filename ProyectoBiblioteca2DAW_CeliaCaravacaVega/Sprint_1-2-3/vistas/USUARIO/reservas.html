<!--Sin css-->

    <main class="container my-5">

        <!-- Título de la página -->
        <h1>Reservas</h1>

        <!-- Sección: Libros a reservar -->
        <section class="mb-5">
            <h2>Libros a reservar</h2>

            <form>
                <!-- Campo texto -->
                <div class="mb-3">
                    <label for="notaEntrega" class="form-label">Delivery note</label>
                    <div class="input-group">
                        <input type="text" id="notaEntrega" class="form-control" placeholder="Value">
                        <button class="btn btn-outline-secondary" type="button">+</button>
                    </div>
                </div>

                <!-- Checkbox -->
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="terminos">
                    <label class="form-check-label" for="terminos">
                        I accept the terms
                    </label>
                </div>

                <a href="#" class="d-block mt-1">Read our T&Cs</a>
            </form>
        </section>

        <!-- Sección: Calendario -->
        <section class="mb-5">
            <h2>Días</h2>

            <!-- Selector mes y año -->
            <div class="d-flex align-items-center gap-3 mb-3">
                <button class="btn btn-light">&lt;</button>

                <select class="form-select w-auto">
                    <option>Dic</option>
                </select>

                <select class="form-select w-auto">
                    <option>2025</option>
                    <option>2026</option>
                </select>

                <button class="btn btn-light">&gt;</button>
            </div>

            <!-- Calendario -->
            <div class="border rounded p-3">
                <div class="row text-center fw-bold mb-2">
                    <div class="col">L</div>
                    <div class="col">M</div>
                    <div class="col">X</div>
                    <div class="col">J</div>
                    <div class="col">V</div>
                    <div class="col">S</div>
                    <div class="col">D</div>
                </div>

                <!-- Semana -->
                <div class="row text-center mb-2">
                    <div class="col">1</div>
                </div>

                <!-- Repite filas según semanas -->
            </div>
        </section>

        <!-- Botón final -->
        <section class="text-start">
            <button class="btn btn-warning">Enviar</button>
        </section>

    </main>
